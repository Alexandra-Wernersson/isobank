[al3d_mbank_native]

	#File settings
run-dir: al3d_mbank_native
dataset: dataset_al3d.dat
flow-file: flow_al3d_native.zip
bank-file: bank_al3d_native.dat

	#Metric settings
variable-format: Mq_chi
psd: ./aLIGOZeroDetHighPower.txt
asd: false
metric-type: symphony
approximant: IMRPhenomD
f-min: 10
f-max: 1024
df: 0.5

	#Parameter space ranges
mtot-range: 30 50
q-range: 1 5
chi-range: -0.99 0.99

	#Dataset generation & flow training options
n-datapoints: 15000
n-layers: 2
hidden-features: 60
n-epochs: 30000
learning-rate: 0.005
patience: 50
min-delta: 1e-3
batch-size: 5000
train-fraction: 0.8
load-flow: false
ignore-boundaries: false
only-ll: true

	#Placing method options
placing-method: random
n-livepoints: 10000
covering-fraction: 0.9
mm: 0.97

	#Communication with the user
plot: false
show: false
verbose: true

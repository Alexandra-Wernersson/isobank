[ecc5D_mbank_native]

	#File settings
run-dir: ecc5D_mbank_native
dataset: dataset_ecc5D.dat
flow-file: flow_ecc5D_native.zip
bank-file: bank_ecc5D_native.dat

	#Metric settings
variable-format: m1m2_s1z_s2z_e
psd: ./aligo_O3actual_H1.txt
asd: true
metric-type: symphony
approximant: TaylorF2Ecc
f-min: 15
f-max: 1024
df: 0.5

	#Parameter space ranges
m1-range: 1 7
m2-range: 1 3
s1-range: -0.9 0.9
s2-range: -0.05 0.05
e-range: 1e-5 0.15

	#Dataset generation & flow training options
n-datapoints: 15000
n-layers: 2
hidden-features: 60
n-epochs: 30000
learning-rate: 0.005
patience: 50
min-delta: 1e-3
batch-size: 5000
train-fraction: 0.8
load-flow: false
ignore-boundaries: false
only-ll: true

	#Placing method options
placing-method: random
n-livepoints: 10000
covering-fraction: 0.9
mm: 0.97

	#Communication with the user
plot: true
show: false
verbose: true
